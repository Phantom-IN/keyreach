<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="keyreach — paste a leaked API key, get a full capability map and a disclosure-ready severity report">
  <title>keyreach</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="clip">
      <rect x="0" y="0" width="1280" height="400" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="4" fill="url(#edge)"/>

    <!-- key icon -->
    <g transform="translate(48,44)">
      <circle cx="21" cy="21" r="19" fill="none" stroke="url(#keyGrad)" stroke-width="4.5"/>
      <circle cx="21" cy="21" r="7" fill="#0b0e14"/>
      <rect x="38" y="17.5" width="46" height="7" rx="1.5" fill="url(#keyGrad)"/>
      <rect x="70" y="24.5" width="7" height="12" fill="url(#keyGrad)"/>
      <rect x="80" y="24.5" width="7" height="16" fill="url(#keyGrad)"/>
    </g>

    <!-- wordmark -->
    <text x="150" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" letter-spacing="0.5" fill="#e6edf3">keyreach</text>
    <g transform="translate(392,50)">
      <rect width="70" height="22" rx="11" fill="none" stroke="#30363d" stroke-width="1.5"/>
      <text x="35" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e" text-anchor="middle">v0.2.0</text>
    </g>

    <!-- tagline -->
    <text x="50" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e">Paste a leaked API key — cloud, AI, payment, comms, or SaaS.</text>
    <text x="50" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e">Full capability map, computed severity, disclosure-ready report.</text>

    <!-- chips -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600">
      <g transform="translate(50,156)">
        <rect width="102" height="26" rx="13" fill="#3fb95022" stroke="#3fb950" stroke-width="1.2"/>
        <text x="51" y="17.5" text-anchor="middle" fill="#7ee787">NO AI/LLM</text>
      </g>
      <g transform="translate(162,156)">
        <rect width="112" height="26" rx="13" fill="#3fb95022" stroke="#3fb950" stroke-width="1.2"/>
        <text x="56" y="17.5" text-anchor="middle" fill="#7ee787">READ-ONLY</text>
      </g>
      <g transform="translate(284,156)">
        <rect width="142" height="26" rx="13" fill="#58a6ff22" stroke="#58a6ff" stroke-width="1.2"/>
        <text x="71" y="17.5" text-anchor="middle" fill="#a5d1ff">DETERMINISTIC</text>
      </g>
      <g transform="translate(436,156)">
        <rect width="196" height="26" rx="13" fill="#d2992222" stroke="#d29922" stroke-width="1.2"/>
        <text x="98" y="17.5" text-anchor="middle" fill="#e3b341">32 PROVIDERS · 9 CATEGORIES</text>
      </g>
    </g>

    <!-- pipeline -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600">
      <!-- detect -->
      <rect x="50" y="230" width="92" height="30" rx="15" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="96" y="250" text-anchor="middle" fill="#a5d1ff">detect</text>
      <path d="M148 245 L164 245 M158 239 L164 245 L158 251" stroke="#484f58" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- validate -->
      <rect x="170" y="230" width="102" height="30" rx="15" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="221" y="250" text-anchor="middle" fill="#7ee787">validate</text>
      <path d="M278 245 L294 245 M288 239 L294 245 L288 251" stroke="#484f58" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- enumerate -->
      <rect x="300" y="230" width="120" height="30" rx="15" fill="none" stroke="#e3b341" stroke-width="1.5"/>
      <text x="360" y="250" text-anchor="middle" fill="#e3b341">enumerate</text>
      <path d="M426 245 L442 245 M436 239 L442 245 L436 251" stroke="#484f58" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- score -->
      <rect x="448" y="230" width="88" height="30" rx="15" fill="none" stroke="#db6d28" stroke-width="1.5"/>
      <text x="492" y="250" text-anchor="middle" fill="#f0a35e">score</text>
      <path d="M542 245 L558 245 M552 239 L558 245 L552 251" stroke="#484f58" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- report -->
      <rect x="564" y="230" width="94" height="30" rx="15" fill="none" stroke="#f85149" stroke-width="1.5"/>
      <text x="611" y="250" text-anchor="middle" fill="#ff8783">report</text>
    </g>

    <text x="50" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#484f58">rule-based · zero AI/LLM dependencies · masked by default</text>

    <text x="50" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6e7681">github.com/Phantom-IN/keyreach</text>

    <!-- terminal mockup -->
    <g transform="translate(690,40)">
      <rect width="546" height="322" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
      <rect width="546" height="34" rx="10" fill="#161b22"/>
      <rect y="24" width="546" height="10" fill="#161b22"/>
      <circle cx="20" cy="17" r="6" fill="#f85149"/>
      <circle cx="40" cy="17" r="6" fill="#e3b341"/>
      <circle cx="60" cy="17" r="6" fill="#3fb950"/>
      <text x="273" y="21" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6e7681">keyreach — zsh</text>

      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
        <text x="22" y="62" fill="#7ee787">$</text>
        <text x="38" y="62" fill="#c9d1d9">keyreach ghp_*********************************AAA</text>

        <text x="22" y="96" fill="#6e7681">Provider</text>
        <text x="150" y="96" fill="#e6edf3">github (devtools)</text>
        <text x="22" y="118" fill="#6e7681">Status</text>
        <text x="150" y="118" fill="#7ee787">valid</text>
        <text x="22" y="140" fill="#6e7681">Account</text>
        <text x="150" y="140" fill="#e6edf3">northwind-ops</text>

        <text x="22" y="174" fill="#8b949e">Capabilities</text>
        <text x="38" y="198" fill="#c9d1d9">GitHub Repositories</text>
        <text x="248" y="198" fill="#ff8783" font-weight="700">write</text>
        <text x="300" y="198" fill="#6e7681">(data)</text>
        <text x="38" y="220" fill="#c9d1d9">GitHub Account</text>
        <text x="248" y="220" fill="#ff8783" font-weight="700">write</text>
        <text x="38" y="242" fill="#c9d1d9">GitHub Gists</text>
        <text x="248" y="242" fill="#e3b341" font-weight="700">read</text>
        <text x="300" y="242" fill="#6e7681">(data)</text>

        <text x="22" y="278" fill="#6e7681">Severity</text>
        <text x="150" y="278" fill="#f85149" font-weight="700">CRITICAL</text>

        <rect x="150" y="290" width="374" height="8" rx="4" fill="#21262d"/>
        <rect x="150" y="290" width="374" height="8" rx="4" fill="url(#edge)"/>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
