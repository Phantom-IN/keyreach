# keyreach detection rules
#
# ─────────────────────────────────────────────────────────────────────────────
# PROVENANCE — read this before adding a rule.
#
# Every pattern here was written from the **provider's own public API
# documentation**. Nothing is copied from another project's rule set.
#
# This is deliberate, and it is a change from the original plan. `plan.md` §5.2
# assumed secrets-patterns-db could seed this file under CC-BY-4.0. Verifying
# that from the upstream repository — which CLAUDE.md rule 5 requires before any
# reuse — showed two independent blockers:
#
#   1. Its LICENSE.md is **CC-BY-SA-4.0** ("Attribution-ShareAlike 4.0
#      International"), not CC-BY-4.0. ShareAlike requires adaptations to carry
#      the same license, and CLAUDE.md rule 5 permits reuse only from
#      MIT / Apache / BSD / CC-BY sources. Its README claims CC-BY-4.0, which
#      contradicts its own LICENSE file; an ambiguous grant is read
#      conservatively, not optimistically.
#   2. That README also states "Trufflehog data is licensed under the AGPL", and
#      the rule set carries no per-rule provenance, so AGPL-derived entries
#      cannot be identified and excluded. keyreach must never copy TruffleHog
#      (CLAUDE.md rule 5, plan.md §5.1).
#
# So these patterns are re-implemented from primary sources — the same treatment
# the project already mandates for AGPL prior art. A key's prefix and length are
# published facts about a format, documented by the vendor; the `source` field
# on each rule records where it came from so any reviewer can re-verify it.
#
# secrets-patterns-db and gitleaks remain valuable as **cross-checks**, and both
# are credited in CREDITS.md. Cross-checking behaviour is not copying.
#
# ─────────────────────────────────────────────────────────────────────────────
# ADDING A RULE
#
#   id          Stable kebab-case identifier. Also the tie-breaker in ranking,
#               so it must be unique.
#   provider    Must match a registered provider's `name` once that plugin
#               exists (keyreach/core/provider.py). Detection may legitimately
#               run ahead of a plugin — recognising a key keyreach cannot yet
#               enumerate is still useful to the user.
#   description Human-readable, shown in output.
#   pattern     Anchored regex. Anchor with ^...$ so a key embedded in a longer
#               string does not match; keyreach receives one key, not a corpus.
#   confidence  See the bands below. Be conservative.
#   source      URL of the vendor documentation the format came from. Required:
#               it is what makes a rule auditable and re-verifiable later.
#
# CONFIDENCE BANDS
#   0.99  Unique vendor prefix plus a fixed length. Effectively unambiguous.
#   0.95  Unique prefix, variable length, or a family of related prefixes.
#   0.80  Distinctive but shorter or less constrained prefix.
#   <0.80 Reserve for genuinely ambiguous formats. Prefer not adding the rule.
#
# Ambiguity between two providers is resolved at the enumerate stage, never by
# inflating confidence here (implementation_plan.md §5).

version: 1

rules:
  # ── Cloud / infrastructure ────────────────────────────────────────────────
  - id: google-api-key
    provider: google
    description: Google API key
    pattern: '^AIza[0-9A-Za-z_-]{35}$'
    confidence: 0.99
    source: https://cloud.google.com/docs/authentication/api-keys

  - id: aws-access-key-id
    provider: aws
    description: AWS access key ID
    pattern: '^(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}$'
    confidence: 0.99
    source: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html

  - id: aws-credential-pair
    provider: aws
    description: AWS access key ID and secret access key
    # AWS is the one provider whose credential is not a single string: nothing
    # can be signed without the secret access key, and temporary ASIA
    # credentials need a session token too. keyreach accepts them colon-joined
    # (keyreach/providers/aws.py). A colon appears in neither part — both are
    # base64 alphabets — so the split is unambiguous, and the anchored bare-ID
    # rule above cannot also match this.
    pattern: '^(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}:[A-Za-z0-9/+=]{40}(:[A-Za-z0-9/+=]{20,})?$'
    confidence: 0.99
    source: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html

  - id: digitalocean-pat
    provider: digitalocean
    description: DigitalOcean personal access token
    pattern: '^dop_v1_[0-9a-f]{64}$'
    confidence: 0.99
    source: https://docs.digitalocean.com/reference/api/create-personal-access-token/

  # ── AI / LLM ──────────────────────────────────────────────────────────────
  - id: anthropic-api-key
    provider: anthropic
    description: Anthropic API key
    # Must be tried before the OpenAI rule: `sk-ant-` also starts with `sk-`.
    # The OpenAI rule excludes it explicitly rather than relying on rule order,
    # so ordering here is a readability aid, not a correctness dependency.
    pattern: '^sk-ant-[A-Za-z0-9_-]{24,}$'
    confidence: 0.99
    source: https://docs.anthropic.com/en/api/getting-started

  - id: openai-project-key
    provider: openai
    description: OpenAI project API key
    pattern: '^sk-proj-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://platform.openai.com/docs/api-reference/authentication

  - id: openai-api-key
    provider: openai
    description: OpenAI API key
    # Negative lookahead keeps Anthropic (`sk-ant-`) and OpenAI's own more
    # specific prefixes from matching here as well. Without it a single key
    # would produce two candidates and waste a probe against the wrong vendor.
    pattern: '^sk-(?!admin-|ant-|proj-|svcacct-)[A-Za-z0-9_-]{20,}$'
    confidence: 0.90
    source: https://platform.openai.com/docs/api-reference/authentication

  - id: openai-service-account-key
    provider: openai
    description: OpenAI service account key
    pattern: '^sk-svcacct-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://platform.openai.com/docs/api-reference/authentication

  - id: openai-admin-key
    provider: openai
    description: OpenAI admin API key
    # A distinct format worth naming: an admin key reaches the Administration
    # API — organization members, projects, API keys, spend — and reaches no
    # model at all. keyreach probes it against a completely different endpoint
    # set (keyreach/providers/openai.py), so calling it "an OpenAI API key"
    # would describe the wrong exposure to whoever reads the report.
    pattern: '^sk-admin-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://developers.openai.com/api/docs/guides/admin-apis

  # ── Payment ───────────────────────────────────────────────────────────────
  - id: stripe-secret-key
    provider: stripe
    description: Stripe secret key
    pattern: '^sk_(live|test)_[0-9A-Za-z]{24,}$'
    confidence: 0.99
    source: https://docs.stripe.com/keys

  - id: stripe-restricted-key
    provider: stripe
    description: Stripe restricted key
    pattern: '^rk_(live|test)_[0-9A-Za-z]{24,}$'
    confidence: 0.99
    source: https://docs.stripe.com/keys#limit-access

  - id: razorpay-key-id
    provider: razorpay
    description: Razorpay API key ID
    pattern: '^rzp_(live|test)_[A-Za-z0-9]{10,}$'
    confidence: 0.99
    source: https://razorpay.com/docs/payments/dashboard/account-settings/api-keys/

  - id: razorpay-key-pair
    provider: razorpay
    description: Razorpay API key ID and secret
    # Razorpay authenticates with Basic auth over `key_id:key_secret`, so the
    # key ID alone cannot be probed. keyreach accepts the pair colon-joined, as
    # it does for AWS and Twilio; a colon appears in neither half, so the split
    # is unambiguous and the anchored key-ID rule above cannot also match this.
    pattern: '^rzp_(live|test)_[A-Za-z0-9]{10,}:[A-Za-z0-9]{20,}$'
    confidence: 0.99
    source: https://razorpay.com/docs/api/authentication/

  # ── Communications ────────────────────────────────────────────────────────
  - id: slack-token
    provider: slack
    description: Slack API token
    pattern: '^xox[baprs]-[0-9A-Za-z-]{10,}$'
    confidence: 0.99
    source: https://docs.slack.dev/authentication/tokens

  - id: twilio-account-sid
    provider: twilio
    description: Twilio account SID
    pattern: '^AC[0-9a-f]{32}$'
    confidence: 0.95
    source: https://www.twilio.com/docs/iam/api-keys

  - id: twilio-api-key-sid
    provider: twilio
    description: Twilio API key SID
    pattern: '^SK[0-9a-f]{32}$'
    confidence: 0.95
    source: https://www.twilio.com/docs/iam/api-keys

  - id: twilio-credential-pair
    provider: twilio
    description: Twilio account SID and auth token
    # Twilio authenticates with Basic auth over `AccountSid:AuthToken`, and the
    # account SID is also part of every request path, so neither half alone can
    # be probed. Both are hexadecimal, so the colon split is unambiguous and the
    # anchored bare-SID rule above cannot also match this.
    pattern: '^AC[0-9a-f]{32}:[0-9a-f]{32}$'
    confidence: 0.99
    source: https://www.twilio.com/docs/usage/requests-to-twilio

  - id: telegram-bot-token
    provider: telegram
    description: Telegram bot token
    pattern: '^[0-9]{8,10}:[A-Za-z0-9_-]{35}$'
    confidence: 0.95
    source: https://core.telegram.org/bots/api#authorizing-your-bot

  # ── Email / marketing ─────────────────────────────────────────────────────
  - id: sendgrid-api-key
    provider: sendgrid
    description: SendGrid API key
    pattern: '^SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}$'
    confidence: 0.99
    source: https://www.twilio.com/docs/sendgrid/ui/account-and-settings/api-keys

  - id: mailgun-api-key
    provider: mailgun
    description: Mailgun private API key
    pattern: '^key-[0-9a-f]{32}$'
    confidence: 0.95
    source: https://documentation.mailgun.com/docs/mailgun/api-reference/authentication/

  # ── Dev platforms / source / CI ───────────────────────────────────────────
  - id: github-token
    provider: github
    description: GitHub access token
    # ghp_ personal, gho_ OAuth, ghu_ user-to-server, ghs_ server-to-server,
    # ghr_ refresh. All share the 36-character body.
    pattern: '^gh[pousr]_[A-Za-z0-9]{36}$'
    confidence: 0.99
    source: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github

  - id: github-fine-grained-pat
    provider: github
    description: GitHub fine-grained personal access token
    pattern: '^github_pat_[A-Za-z0-9_]{22,}$'
    confidence: 0.99
    source: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

  - id: gitlab-pat
    provider: gitlab
    description: GitLab personal access token
    pattern: '^glpat-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://docs.gitlab.com/ee/user/profile/personal_access_tokens.html

  - id: npm-access-token
    provider: npm
    description: npm access token
    pattern: '^npm_[A-Za-z0-9]{36}$'
    confidence: 0.99
    source: https://docs.npmjs.com/about-access-tokens

  - id: pypi-api-token
    provider: pypi
    description: PyPI API token
    pattern: '^pypi-[A-Za-z0-9_-]{50,}$'
    confidence: 0.99
    source: https://pypi.org/help/#apitoken
