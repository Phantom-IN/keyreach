# keyreach detection rules
#
# ─────────────────────────────────────────────────────────────────────────────
# PROVENANCE — read this before adding a rule.
#
# Every pattern here was written from the **provider's own public API
# documentation**. Nothing is copied from another project's rule set.
#
# This is deliberate, and it is a change from the original plan. `plan.md` §5.2
# assumed secrets-patterns-db could seed this file under CC-BY-4.0. Verifying
# that from the upstream repository — which CLAUDE.md rule 5 requires before any
# reuse — showed two independent blockers:
#
#   1. Its LICENSE.md is **CC-BY-SA-4.0** ("Attribution-ShareAlike 4.0
#      International"), not CC-BY-4.0. ShareAlike requires adaptations to carry
#      the same license, and CLAUDE.md rule 5 permits reuse only from
#      MIT / Apache / BSD / CC-BY sources. Its README claims CC-BY-4.0, which
#      contradicts its own LICENSE file; an ambiguous grant is read
#      conservatively, not optimistically.
#   2. That README also states "Trufflehog data is licensed under the AGPL", and
#      the rule set carries no per-rule provenance, so AGPL-derived entries
#      cannot be identified and excluded. keyreach must never copy TruffleHog
#      (CLAUDE.md rule 5, plan.md §5.1).
#
# So these patterns are re-implemented from primary sources — the same treatment
# the project already mandates for AGPL prior art. A key's prefix and length are
# published facts about a format, documented by the vendor; the `source` field
# on each rule records where it came from so any reviewer can re-verify it.
#
# secrets-patterns-db and gitleaks remain valuable as **cross-checks**, and both
# are credited in CREDITS.md. Cross-checking behaviour is not copying.
#
# ─────────────────────────────────────────────────────────────────────────────
# ADDING A RULE
#
#   id          Stable kebab-case identifier. Also the tie-breaker in ranking,
#               so it must be unique.
#   provider    Must match a registered provider's `name` once that plugin
#               exists (keyreach/core/provider.py). Detection may legitimately
#               run ahead of a plugin — recognising a key keyreach cannot yet
#               enumerate is still useful to the user.
#   description Human-readable, shown in output.
#   pattern     Anchored regex. Anchor with ^...$ so a key embedded in a longer
#               string does not match; keyreach receives one key, not a corpus.
#   confidence  See the bands below. Be conservative.
#   source      URL of the vendor documentation the format came from. Required:
#               it is what makes a rule auditable and re-verifiable later.
#
# CONFIDENCE BANDS
#   0.99  Unique vendor prefix plus a fixed length. Effectively unambiguous.
#   0.95  Unique prefix, variable length, or a family of related prefixes.
#   0.80  Distinctive but shorter or less constrained prefix.
#   <0.80 Reserve for genuinely ambiguous formats. Prefer not adding the rule.
#
# Ambiguity between two providers is resolved at the enumerate stage, never by
# inflating confidence here (implementation_plan.md §5).

version: 1

rules:
  # ── Cloud / infrastructure ────────────────────────────────────────────────
  - id: google-api-key
    provider: google
    description: Google API key
    pattern: '^AIza[0-9A-Za-z_-]{35}$'
    confidence: 0.99
    source: https://cloud.google.com/docs/authentication/api-keys

  - id: aws-access-key-id
    provider: aws
    description: AWS access key ID
    pattern: '^(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}$'
    confidence: 0.99
    source: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html

  - id: aws-credential-pair
    provider: aws
    description: AWS access key ID and secret access key
    # AWS is the one provider whose credential is not a single string: nothing
    # can be signed without the secret access key, and temporary ASIA
    # credentials need a session token too. keyreach accepts them colon-joined
    # (keyreach/providers/aws.py). A colon appears in neither part — both are
    # base64 alphabets — so the split is unambiguous, and the anchored bare-ID
    # rule above cannot also match this.
    pattern: '^(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}:[A-Za-z0-9/+=]{40}(:[A-Za-z0-9/+=]{20,})?$'
    confidence: 0.99
    source: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html

  - id: digitalocean-pat
    provider: digitalocean
    description: DigitalOcean personal access token
    pattern: '^dop_v1_[0-9a-f]{64}$'
    confidence: 0.99
    source: https://docs.digitalocean.com/reference/api/create-personal-access-token/

  # ── AI / LLM ──────────────────────────────────────────────────────────────
  - id: anthropic-api-key
    provider: anthropic
    description: Anthropic API key
    # Must be tried before the OpenAI rule: `sk-ant-` also starts with `sk-`.
    # The OpenAI rule excludes it explicitly rather than relying on rule order,
    # so ordering here is a readability aid, not a correctness dependency.
    pattern: '^sk-ant-[A-Za-z0-9_-]{24,}$'
    confidence: 0.99
    source: https://docs.anthropic.com/en/api/getting-started

  - id: openai-project-key
    provider: openai
    description: OpenAI project API key
    pattern: '^sk-proj-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://platform.openai.com/docs/api-reference/authentication

  - id: openai-api-key
    provider: openai
    description: OpenAI API key
    # Negative lookahead keeps Anthropic (`sk-ant-`) and OpenAI's own more
    # specific prefixes from matching here as well. Without it a single key
    # would produce two candidates and waste a probe against the wrong vendor.
    pattern: '^sk-(?!admin-|ant-|proj-|svcacct-)[A-Za-z0-9_-]{20,}$'
    confidence: 0.90
    source: https://platform.openai.com/docs/api-reference/authentication

  - id: openai-service-account-key
    provider: openai
    description: OpenAI service account key
    pattern: '^sk-svcacct-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://platform.openai.com/docs/api-reference/authentication

  - id: openai-admin-key
    provider: openai
    description: OpenAI admin API key
    # A distinct format worth naming: an admin key reaches the Administration
    # API — organization members, projects, API keys, spend — and reaches no
    # model at all. keyreach probes it against a completely different endpoint
    # set (keyreach/providers/openai.py), so calling it "an OpenAI API key"
    # would describe the wrong exposure to whoever reads the report.
    pattern: '^sk-admin-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://developers.openai.com/api/docs/guides/admin-apis

  # ── Payment ───────────────────────────────────────────────────────────────
  - id: stripe-secret-key
    provider: stripe
    description: Stripe secret key
    pattern: '^sk_(live|test)_[0-9A-Za-z]{24,}$'
    confidence: 0.99
    source: https://docs.stripe.com/keys

  - id: stripe-restricted-key
    provider: stripe
    description: Stripe restricted key
    pattern: '^rk_(live|test)_[0-9A-Za-z]{24,}$'
    confidence: 0.99
    source: https://docs.stripe.com/keys#limit-access

  - id: paystack-secret-key
    provider: paystack
    description: Paystack secret key
    # Deliberately identical to `stripe-secret-key` above. Both vendors document
    # the same `sk_live_`/`sk_test_` prefix and neither publishes a length or
    # charset that separates them, so both rules fire and the engine probes both
    # candidates — the ambiguity resolution `implementation_plan.md` §5 always
    # specified, exercised for the first time in R2.1. Narrowing either pattern
    # to "fix" the overlap would be inventing a fact the vendor has not stated.
    pattern: '^sk_(live|test)_[0-9A-Za-z]{24,}$'
    confidence: 0.99
    source: https://paystack.com/docs/api/authentication/

  - id: razorpay-key-id
    provider: razorpay
    description: Razorpay API key ID
    pattern: '^rzp_(live|test)_[A-Za-z0-9]{10,}$'
    confidence: 0.99
    source: https://razorpay.com/docs/payments/dashboard/account-settings/api-keys/

  - id: razorpay-key-pair
    provider: razorpay
    description: Razorpay API key ID and secret
    # Razorpay authenticates with Basic auth over `key_id:key_secret`, so the
    # key ID alone cannot be probed. keyreach accepts the pair colon-joined, as
    # it does for AWS and Twilio; a colon appears in neither half, so the split
    # is unambiguous and the anchored key-ID rule above cannot also match this.
    pattern: '^rzp_(live|test)_[A-Za-z0-9]{10,}:[A-Za-z0-9]{20,}$'
    confidence: 0.99
    source: https://razorpay.com/docs/api/authentication/

  # ── Communications ────────────────────────────────────────────────────────
  - id: slack-token
    provider: slack
    description: Slack API token
    pattern: '^xox[baprs]-[0-9A-Za-z-]{10,}$'
    confidence: 0.99
    source: https://docs.slack.dev/authentication/tokens

  - id: twilio-account-sid
    provider: twilio
    description: Twilio account SID
    pattern: '^AC[0-9a-f]{32}$'
    confidence: 0.95
    source: https://www.twilio.com/docs/iam/api-keys

  - id: twilio-api-key-sid
    provider: twilio
    description: Twilio API key SID
    pattern: '^SK[0-9a-f]{32}$'
    confidence: 0.95
    source: https://www.twilio.com/docs/iam/api-keys

  - id: twilio-credential-pair
    provider: twilio
    description: Twilio account SID and auth token
    # Twilio authenticates with Basic auth over `AccountSid:AuthToken`, and the
    # account SID is also part of every request path, so neither half alone can
    # be probed. Both are hexadecimal, so the colon split is unambiguous and the
    # anchored bare-SID rule above cannot also match this.
    pattern: '^AC[0-9a-f]{32}:[0-9a-f]{32}$'
    confidence: 0.99
    source: https://www.twilio.com/docs/usage/requests-to-twilio

  - id: telegram-bot-token
    provider: telegram
    description: Telegram bot token
    pattern: '^[0-9]{8,10}:[A-Za-z0-9_-]{35}$'
    confidence: 0.95
    source: https://core.telegram.org/bots/api#authorizing-your-bot

  # ── Email / marketing ─────────────────────────────────────────────────────
  - id: sendgrid-api-key
    provider: sendgrid
    description: SendGrid API key
    # `SG.` followed by two dot-separated segments, which is the shape SendGrid
    # publishes in the create-API-key response example ("SG.xxxxxxxx.yyyyyyyy").
    #
    # R2.3 relaxed this from `{22}` and `{43}`. Those lengths are correct for
    # every key seen in the wild, and SendGrid has never published either of
    # them — they were an unsourced fact wearing a `source:` field. A rule that
    # pins a length the vendor does not state stops matching the day the vendor
    # changes it, silently, which is the failure mode a detector cannot afford.
    # The `SG.` prefix carries the specificity here; the segment minimums are
    # entropy floors, not a claim about SendGrid's format.
    pattern: '^SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}$'
    confidence: 0.95
    source: https://www.twilio.com/docs/sendgrid/api-reference/api-keys/create-api-keys

  # NO `mailgun` RULE — WITHDRAWN IN R2.3, DELIBERATELY.
  #
  # This file carried `^key-[0-9a-f]{32}$` from R0.5, sourced to Mailgun's
  # authentication page. Re-verifying that page in R2.3 found it now documents
  # only `curl --user 'api:YOUR_API_KEY'` — no prefix, no length, no charset —
  # and neither does any other page Mailgun publishes, including the API key
  # management guide it rewrote around its RBAC roles.
  #
  # So the rule's cited source no longer supports it, and a rule nobody can
  # re-verify is exactly what the PROVENANCE note above exists to prevent. It is
  # withdrawn rather than re-sourced or quietly kept: `keyreach/providers/
  # mailgun.py` sets `detectable = False` and is reached with `--provider
  # mailgun`, which records in the report that the operator asserted it.
  #
  # This is the first rule keyreach has had to withdraw because a vendor stopped
  # publishing a format, and it is the drift that **R2.10**'s canary is meant to
  # catch without a human re-reading the docs.

  - id: resend-api-key
    provider: resend
    description: Resend API key
    # `re_` plus an opaque body, from the token in Resend's own create-API-key
    # response example. Resend publishes the prefix by example and states no
    # length, so this constrains the prefix and the charset only.
    pattern: '^re_[A-Za-z0-9_]{16,}$'
    confidence: 0.95
    source: https://resend.com/docs/api-reference/api-keys/create-api-key

  - id: mailchimp-api-key
    provider: mailchimp
    description: Mailchimp Marketing API key
    # Documented as "key-dc": a hex body, a hyphen, and the data centre
    # subdomain that also decides which host the key must be sent to. Mailchimp's
    # own example is `0123456789abcdef0123456789abcde-us6`, whose body is 31
    # characters; keys issued today are 32. The range spans both rather than
    # picking the one that suits — the vendor's example is the only published
    # length there is.
    pattern: '^[0-9a-f]{30,32}-[a-z]{2,4}[0-9]{1,3}$'
    confidence: 0.95
    source: https://mailchimp.com/developer/marketing/docs/fundamentals/

  # ── Dev platforms / source / CI ───────────────────────────────────────────
  - id: github-token
    provider: github
    description: GitHub access token
    # ghp_ personal, gho_ OAuth, ghu_ user-to-server, ghs_ server-to-server,
    # ghr_ refresh. All share the 36-character body.
    pattern: '^gh[pousr]_[A-Za-z0-9]{36}$'
    confidence: 0.99
    source: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github

  - id: github-fine-grained-pat
    provider: github
    description: GitHub fine-grained personal access token
    pattern: '^github_pat_[A-Za-z0-9_]{22,}$'
    confidence: 0.99
    source: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

  - id: gitlab-pat
    provider: gitlab
    description: GitLab access token
    # `glpat-` is documented on GitLab's token-prefix table, which is where the
    # `source` now points. R2.4 re-verified the page this rule had cited since
    # R0.5 — the personal-access-token guide — and found it no longer names any
    # prefix; it says only that tokens "inherit the default prefix setting".
    # The rule is correct and its citation was not, which is the cheaper half of
    # what R2.3 found at Mailgun.
    #
    # The same prefix covers personal, project and group access tokens. Nothing
    # published separates them, and the engine does not need to: GitLab's
    # `/personal_access_tokens/self` answers for all three.
    #
    # Note the limit GitLab states outright: this prefix is the *default*, and a
    # self-managed administrator can change it for personal access tokens. A
    # customised instance is therefore undetectable and needs `--provider`.
    pattern: '^glpat-[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://docs.gitlab.com/security/tokens/

  # NO `npm` RULE — WITHDRAWN IN R2.4, ON THE SAME GROUND AS MAILGUN IN R2.3.
  #
  # This file carried `^npm_[A-Za-z0-9]{36}$` from R0.5, sourced to npm's
  # "About access tokens" page. Re-verifying that page in R2.4 found it
  # describes a token only as "a hexadecimal string that you can use to
  # authenticate" — no prefix, and a charset the rule contradicts. npm's CLI
  # reference and its CI/CD guide both deliberately avoid printing a token
  # value at all ("Do **not** put a token in this file"), so there is nowhere
  # left in npm's own documentation to source a format from.
  #
  # That page also records that legacy tokens were removed in November 2025 and
  # only granular access tokens remain, so the format the rule was written
  # against is a format npm no longer issues.
  #
  # `keyreach/providers/npm.py` sets `detectable = False` and is reached with
  # `--provider npm`. Second withdrawal in two items; see `plan.md` §5.2.

  - id: pypi-api-token
    provider: pypi
    description: PyPI API token
    # Verified again in R2.4: pypi.org/help still says "Set your password to
    # the token value, including the `pypi-` prefix".
    #
    # **This rule deliberately has no plugin behind it.** PyPI documents nine
    # APIs and exactly one takes an API token — `POST upload.pypi.org/legacy/`,
    # which publishes a package. There is no authenticated read, so keyreach
    # cannot validate or enumerate a PyPI token without performing a write, and
    # it will not. Detection is still worth having on its own: the report names
    # the vendor and the rotation guide. See `plan.md` §5.2 and ROADMAP R2.4.
    pattern: '^pypi-[A-Za-z0-9_-]{50,}$'
    confidence: 0.99
    source: https://pypi.org/help/#apitoken

  - id: dockerhub-access-token
    provider: dockerhub
    description: Docker Hub access token
    # Both prefixes come from Docker's own OpenAPI specification, which is the
    # only place Docker publishes them: the auth request's `secret` field is
    # exampled as `dckr_pat_124509ugsdjga93`, and the organization-token
    # response's `token` field as `dckr_oat_7awgM4jG5SQvxcvmNzhKj8PQjxo`.
    # Docker's prose access-token pages show neither.
    #
    # Matched with an optional `<identifier>:` prefix because Docker's token
    # exchange requires both halves — a bare token is recognised, reported, and
    # explicitly not probed, the same treatment a bare AWS access key id gets.
    pattern: '^(?:[A-Za-z0-9][A-Za-z0-9._-]*:)?dckr_(?:pat|oat)_[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://docs.docker.com/reference/api/hub/latest/

  # ── Databases / data infra ────────────────────────────────────────────────
  - id: pinecone-api-key
    provider: pinecone
    description: Pinecone API key
    # `pcsk_abc123` is exampled in Pinecone's CLI command reference
    # (`pc config set-api-key pcsk_abc123`). Pinecone's authentication page and
    # its key-management guide both show only `YOUR_API_KEY`, so the CLI
    # reference is the one place the prefix appears — checked by reading the
    # page rather than by trusting a search result, after R2.4 found a search
    # engine confidently inventing an npm token format that page did not carry.
    pattern: '^pcsk_[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://docs.pinecone.io/reference/cli/command-reference

  - id: supabase-secret-key
    provider: supabase
    description: Supabase secret key
    # Supabase documents `sb_secret_…` as the current server-side key and says
    # it has "full access to your project's data, bypassing Row Level
    # Security". Kept separate from the publishable rule below because the two
    # are opposite findings and should never share a description.
    #
    # The key carries no project reference, so this plugin needs
    # `<project ref>:<key>`; a bare key is recognised, reported and not probed.
    pattern: '^(?:[a-z]{20}:)?sb_secret_[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://supabase.com/docs/guides/api/api-keys

  - id: supabase-publishable-key
    provider: supabase
    description: Supabase publishable key
    # Documented as "safe to expose online: web page, mobile or desktop app,
    # GitHub actions, CLIs, source code". Detected so a report can say exactly
    # that, which is more useful than silence when one turns up in a scan.
    pattern: '^(?:[a-z]{20}:)?sb_publishable_[A-Za-z0-9_-]{20,}$'
    confidence: 0.99
    source: https://supabase.com/docs/guides/api/api-keys
