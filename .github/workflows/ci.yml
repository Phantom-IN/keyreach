# keyreach CI — HYGIENE ONLY (for now)
#
# ⚠️ This is a deliberately minimal placeholder pipeline.
#
# keyreach is being built in public, and this workflow intentionally lags the
# codebase: it checks that the governance files are present and that the
# Markdown is well-formed, and nothing else.
#
# As of R0.2 the repository DOES have a `pyproject.toml`, a `keyreach/` package,
# and a test suite — but ruff / black / mypy / pytest are not run here yet, and
# that is on purpose rather than an oversight. Wiring them in is roadmap item
# R0.9, which owns the CI pipeline end to end; splitting it across two items
# would mean building the same jobs twice. Until R0.9 lands, those gates run at
# commit time via .pre-commit-config.yaml (`pre-commit install`).
#
# ┌────────────────────────────────────────────────────────────────────────────┐
# │ THE REAL PIPELINE IS ROADMAP ITEM R0.9 — `feat/r0.9-ci-guardrails`.        │
# │                                                                            │
# │ It replaces/extends this file with the guardrails specified in             │
# │ implementation_plan.md §11, which are what actually enforce keyreach's     │
# │ hard rules:                                                                │
# │                                                                            │
# │   • ai_ban            — fail if any dependency, import, or source string   │
# │                         matches the denylist of AI/LLM SDKs and model API  │
# │                         hostnames (plan.md §1: no AI/LLM, anywhere, ever)  │
# │   • network_isolation — fail if anything under keyreach/providers/ imports │
# │                         httpx / socket / requests directly (probes must go │
# │                         through ProbeContext)                              │
# │   • read_only         — static scan flagging non-idempotent HTTP methods   │
# │                         that aren't explicitly annotated and reviewed      │
# │   • schema drift      — regenerate report.schema.json and fail on diff     │
# │   • ruff / black / mypy, and pytest with a coverage threshold              │
# │                                                                            │
# │ Acceptance criterion for R0.9: a PR that adds an AI SDK, a direct socket   │
# │ in providers/, or a non-idempotent probe FAILS CI.                         │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Until then: do NOT add steps here that reference files which do not exist yet
# — a red X on every commit teaches people to ignore CI.

name: CI (hygiene)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required governance and planning files exist
        run: |
          set -euo pipefail

          required=(
            LICENSE
            NOTICE
            CREDITS.md
            THIRD_PARTY_LICENSES.md
            README.md
            ROADMAP.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            CLAUDE.md
            plan.md
            implementation_plan.md
            .gitignore
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.md
            .github/ISSUE_TEMPLATE/feature_request.md
            .github/ISSUE_TEMPLATE/new_provider.md
          )

          missing=0
          for f in "${required[@]}"; do
            if [ -s "$f" ]; then
              echo "  ok       $f"
            else
              echo "  MISSING  $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "::error::One or more required governance files are missing or empty."
            echo "See CONTRIBUTING.md — these files are part of the definition of done."
            exit 1
          fi

      - name: Check the license is Apache-2.0
        run: |
          set -euo pipefail
          # keyreach is permissively licensed and must stay that way: reused code
          # is MIT/Apache/BSD/CC-BY only, never AGPL/GPL. See plan.md §10.
          if ! grep -q "Apache License" LICENSE; then
            echo "::error::LICENSE does not look like the Apache License 2.0 (plan.md §10)."
            exit 1
          fi
          if ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error::LICENSE is not Apache License version 2.0."
            exit 1
          fi
          echo "LICENSE is Apache-2.0."

      - name: Check NOTICE and THIRD_PARTY_LICENSES are non-trivial
        run: |
          set -euo pipefail
          # Attribution is maintained from commit #1 — see plan.md §5.6.
          for f in NOTICE THIRD_PARTY_LICENSES.md CREDITS.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 5 ]; then
              echo "::error::$f looks like a stub ($lines lines). Attribution is not optional."
              exit 1
            fi
          done
          echo "Attribution files present."

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint Markdown
        # Rules come from the checked-in .markdownlint-cli2.jsonc (added in
        # R0.2), so this job, the pre-commit hook, and a local run all agree.
        # Version pinned deliberately: an unpinned linter turns an upstream
        # release into a surprise red build on an unrelated PR.
        run: npx --yes markdownlint-cli2@0.23.2

  # ── Not yet wired ───────────────────────────────────────────────────────────
  # Roadmap R0.9 (`feat/r0.9-ci-guardrails`) adds, in this file:
  #   jobs: ai-ban, network-isolation, read-only, schema-drift, lint, types, test
  # Roadmap R2.10 (`feat/r2.10-drift-canary`) adds .github/workflows/drift-canary.yml
  #   — a scheduled provider-API drift check that opens issues automatically.
  # Roadmap R1.6 (`chore/r1.6-release-0.1`) adds the PyPI publish workflow.
