# keyreach CI (roadmap item R0.9 — implementation_plan.md §11).
#
# This workflow is what actually enforces keyreach's hard rules. Until R0.9 it
# checked governance files and Markdown only, and everything else ran on author
# and reviewer discipline.
#
# The four guardrails are Python modules under tools/guardrails/, not shell
# pipelines inlined here. That is deliberate:
#
#   * they are unit-tested, so each one has been watched to fail. R0.6 found
#     ruff's banned-api rule had been silently inert since R0.2 — configured,
#     parsed, and applied to nothing — while three pull requests asserted it was
#     enforcing. A check nobody has seen fail is a check nobody should trust.
#   * they run identically here, in .pre-commit-config.yaml, and under pytest,
#     from one implementation. A contributor learns at commit time, not after a
#     red build.
#   * they are readable. `grep -r` in YAML is where subtle exemptions go to hide.
#
# Acceptance criterion for R0.9: a pull request that adds an AI SDK, a direct
# socket in providers/, or a non-idempotent probe FAILS CI. tests/test_guardrails.py
# plants all three and asserts each is caught.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a CPython patch release cannot change a result between runs. The
  # test matrix below covers the full supported range separately.
  DEFAULT_PYTHON: '3.11'

jobs:
  # ── The hard rules ─────────────────────────────────────────────────────────
  guardrails:
    name: Guardrails (ai_ban, network_isolation, read_only, no_secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guardrails enumerate files through `git ls-files`, so they need
          # a real working tree. Depth 1 is enough — they inspect the tree, not
          # its history.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - run: pip install -e '.[dev]'

      # Run every check even if an earlier one fails, so a contributor sees the
      # whole picture in one run instead of fixing violations one build at a
      # time. `python -m tools.guardrails` already does this internally.
      - name: Run all guardrails
        run: python -m tools.guardrails

  # ── Generated artifacts must not drift from the code that generates them ───
  drift:
    name: Generated artifacts up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - run: pip install -e '.[dev]'

      - name: report.schema.json matches the models
        run: python -m keyreach.report.schema --check

      # Golden reports are generated from the renderers exactly as the schema is
      # generated from the models, so they get the same treatment. Without this,
      # a renderer change plus a stale snapshot is a silent change to the
      # artifact a security team receives.
      - name: Golden reports match the renderers
        run: python -m tests.regenerate_goldens --check

  # ── Style and types ────────────────────────────────────────────────────────
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - run: pip install -e '.[dev]'

      - name: ruff
        run: ruff check --output-format=github .

      - name: black
        run: black --check --diff .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - run: pip install -e '.[dev]'

      # Tests and tooling are typed too. `mypy keyreach` alone passes on code
      # the pre-commit hook rejects — that discrepancy hid an error through R0.7.
      - name: mypy
        run: mypy keyreach tests tools

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims to support in its classifiers. A
        # claim nothing tests is a claim, not a fact.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e '.[dev]'

      # No network access is needed: every probe replays a committed cassette,
      # and replay constructs no HTTP client at all (implementation_plan.md
      # §6.1). If a test ever needs a live key, this is where it will fail.
      - name: pytest
        run: pytest -q --cov=keyreach --cov-report=term-missing

  # ── Packaging ──────────────────────────────────────────────────────────────
  package:
    name: Wheel builds and ships its data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip

      - run: pip install -e '.[dev]'

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      # keyreach reads three files at run time that are easy to leave out of a
      # wheel: the detection rules, the report schema, and the Markdown
      # template. Each has failed for an installed user in other projects while
      # working perfectly from a checkout, so the wheel is installed into a
      # clean environment and exercised from outside the source tree.
      - name: Package data survives installation
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          from importlib import resources

          from keyreach.core.detect import default_detector
          from keyreach.report.schema import SCHEMA_PATH

          rules = default_detector.rules()
          assert rules, "detection rules missing from the wheel"
          assert SCHEMA_PATH.is_file(), "report.schema.json missing from the wheel"
          template = resources.files("keyreach.report") / "templates" / "report.md.j2"
          assert template.is_file(), "Markdown template missing from the wheel"
          print("package data present:", len(rules), "rules")
          PY

      - name: CLI entrypoint resolves
        run: |
          set -euo pipefail
          /tmp/verify/bin/keyreach --version

  # ── Repository hygiene (kept from the R0.1 pipeline) ───────────────────────
  governance:
    name: Governance files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required governance and planning files exist
        run: |
          set -euo pipefail

          required=(
            LICENSE
            NOTICE
            CREDITS.md
            THIRD_PARTY_LICENSES.md
            README.md
            ROADMAP.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            CLAUDE.md
            plan.md
            implementation_plan.md
            .gitignore
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.md
            .github/ISSUE_TEMPLATE/feature_request.md
            .github/ISSUE_TEMPLATE/new_provider.md
          )

          missing=0
          for f in "${required[@]}"; do
            if [ -s "$f" ]; then
              echo "  ok       $f"
            else
              echo "  MISSING  $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "::error::One or more required governance files are missing or empty."
            echo "See CONTRIBUTING.md — these files are part of the definition of done."
            exit 1
          fi

      - name: Check the license is Apache-2.0
        run: |
          set -euo pipefail
          # keyreach is permissively licensed and must stay that way: reused code
          # is MIT/Apache/BSD/CC-BY only, never AGPL/GPL. See plan.md §10.
          if ! grep -q "Apache License" LICENSE; then
            echo "::error::LICENSE does not look like the Apache License 2.0 (plan.md §10)."
            exit 1
          fi
          if ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error::LICENSE is not Apache License version 2.0."
            exit 1
          fi
          echo "LICENSE is Apache-2.0."

      - name: Check NOTICE and THIRD_PARTY_LICENSES are non-trivial
        run: |
          set -euo pipefail
          # Attribution is maintained from commit #1 — see plan.md §5.6.
          for f in NOTICE THIRD_PARTY_LICENSES.md CREDITS.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 5 ]; then
              echo "::error::$f looks like a stub ($lines lines). Attribution is not optional."
              exit 1
            fi
          done
          echo "Attribution files present."

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint Markdown
        # Rules come from the checked-in .markdownlint-cli2.jsonc (added in
        # R0.2), so this job, the pre-commit hook, and a local run all agree.
        # Version pinned deliberately: an unpinned linter turns an upstream
        # release into a surprise red build on an unrelated PR.
        run: npx --yes markdownlint-cli2@0.23.2

  # ── Branch-protection anchor ───────────────────────────────────────────────
  # One required status check instead of eleven. Adding a job above does not
  # then require editing branch protection to make it blocking — a gap that is
  # easy to create and invisible once created.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [guardrails, drift, lint, types, test, package, governance, markdown]
    steps:
      - name: Fail if any job did not succeed
        run: |
          set -euo pipefail
          # `needs.*.result` is 'success', 'failure', 'cancelled' or 'skipped'.
          # Anything other than success is a failure here: a skipped required
          # job must not read as a pass.
          results='${{ join(needs.*.result, " ") }}'
          echo "job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job reported '$result'."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
