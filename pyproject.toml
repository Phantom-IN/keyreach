[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ==============================================================================
# Project metadata
# ==============================================================================

[project]
name = "keyreach"
dynamic = ["version"]  # single-sourced from keyreach/__init__.py, see [tool.hatch.version]
description = "Map what an exposed API key can actually reach — deterministic, read-only, no AI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Vaibhav Vanage (Phantom-IN)", email = "vaibhav.vanage@gmail.com" },
]
keywords = [
  "security",
  "api-key",
  "bug-bounty",
  "pentest",
  "credential",
  "secrets",
  "capability-enumeration",
  "disclosure",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

# ------------------------------------------------------------------------------
# Runtime dependencies — the stack fixed in implementation_plan.md §1.
#
# ⛔ NO AI/LLM SDKs. Not now, not ever. keyreach handles live secrets; routing one
#    to a model would itself be a credential leak, and it would destroy the
#    reproducibility and auditability the whole tool rests on (plan.md §1).
#    Note the irony to avoid: keyreach PROBES AI providers' endpoints with a
#    user-supplied key — that is the product — but it must never IMPORT their
#    SDKs to call a model. Probes are plain httpx requests.
#    tests/test_packaging.py asserts this; the full `ai_ban` guardrail is R0.9.
#
# Every license below was verified from PyPI metadata on 2026-08-11 and recorded
# in THIRD_PARTY_LICENSES.md. All permissive; none vendored.
# ------------------------------------------------------------------------------
dependencies = [
  "typer>=0.12,<1.0",   # MIT          — CLI
  "httpx>=0.27,<1.0",   # BSD-3-Clause — async HTTP, the only socket-opening dep
  "rich>=13.7",         # MIT          — terminal rendering
  "pydantic>=2.7,<3.0", # MIT          — typed models + JSON schema export
  "Jinja2>=3.1,<4.0",   # BSD-3-Clause — Markdown/HTML report templates
  "PyYAML>=6.0,<7.0",   # MIT          — detection rules + declarative probes
]

[project.optional-dependencies]
# respx and syrupy were declared here in R0.2 and never imported. R0.6 built its
# own cassette format (JSON, keyed by redacted URL, replaying without
# constructing an HTTP client at all) and R0.8 checked golden reports in as
# plain files so a reviewer reads the actual report in the diff. Keeping unused
# dependencies in a security tool means licenses to re-verify and installs to
# trust for no benefit, and it invites a second way to do a job that already has
# one. Removed in R0.8.
dev = [
  "pytest>=8.2",      # MIT
  "pytest-asyncio>=0.24", # Apache-2.0 — probes are async from R0.6 onward
  "pytest-cov>=5.0",  # MIT
  "ruff>=0.6",        # MIT
  "black>=24.4",      # MIT
  "mypy>=1.10",       # MIT
  "types-PyYAML>=6.0",# Apache-2.0   — stubs for the PyYAML runtime dependency
  "pre-commit>=3.7",  # MIT
  "build>=1.2",       # MIT
  "twine>=5.1",       # Apache-2.0
]

[project.scripts]
keyreach = "keyreach.cli:run"

[project.urls]
Homepage = "https://github.com/Phantom-IN/keyreach"
Repository = "https://github.com/Phantom-IN/keyreach"
Issues = "https://github.com/Phantom-IN/keyreach/issues"
Changelog = "https://github.com/Phantom-IN/keyreach/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Phantom-IN/keyreach/blob/main/ROADMAP.md"
"Security Policy" = "https://github.com/Phantom-IN/keyreach/blob/main/SECURITY.md"

# ==============================================================================
# Build
# ==============================================================================

[tool.hatch.version]
# Single source of truth. Bumping keyreach/__init__.py bumps the distribution,
# so the CLI's --version and the installed metadata can never drift apart
# (tests/test_cli.py asserts they agree).
path = "keyreach/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["keyreach"]

[tool.hatch.build.targets.sdist]
# Ship the governance and planning docs in the sdist: the licences of anything
# reused travel with the code, and the plans are what the code is reviewed
# against (CLAUDE.md, "Repo docs & how to use them").
include = [
  "/keyreach",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CREDITS.md",
  "/THIRD_PARTY_LICENSES.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/ROADMAP.md",
  "/plan.md",
  "/implementation_plan.md",
  "/CLAUDE.md",
]

# ==============================================================================
# Formatting — black owns layout; ruff never formats (see [tool.ruff]).
# ==============================================================================

[tool.black]
line-length = 88
target-version = ["py311"]

# ==============================================================================
# Linting
# ==============================================================================

[tool.ruff]
line-length = 88          # must match [tool.black] or the two will fight
target-version = "py311"
src = ["keyreach", "tests"]

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins       — no shadowing builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez      — bans naive/ad-hoc clock reads (determinism!)
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # ruff-specific
  "S",   # flake8-bandit         — security lint; this is a security tool
  "SIM", # flake8-simplify
  "T20", # flake8-print          — output goes through rich/typer, not print()
  "TID", # flake8-tidy-imports   — enforces the banned-api block below. Without
  #                                this selected, that config is silently inert:
  #                                ruff reads it and applies nothing.
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "E501", # line length is black's job, and it disagrees on long string literals
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), take fixture arguments they don't always use (ARG), and
# compare against literal expectations (PLR2004) — all correct in a test.
# PLR0913 too: a table-driven suite builds its inputs through one keyword-only
# factory per model, and splitting that factory up to satisfy an argument count
# would make the tables less readable, not more.
"tests/**" = ["S101", "ARG", "PLR2004", "PLR0913"]
# The banned-api rule below forbids importing httpx anywhere, which is the
# point: provider plugins must go through ProbeContext. core/http.py is the one
# module that legitimately opens sockets, so it is the one exemption — and
# keeping the exemption to a single named file is what makes the rule mean
# something (CLAUDE.md, "Where things live").
"keyreach/core/http.py" = ["TID251"]
# The HTTP layer's own tests need httpx to build a MockTransport. Scoped to this
# one file rather than to `tests/**`, so a provider test cannot quietly acquire
# a direct HTTP dependency — the provider fixtures under tests/ are held to the
# same rule as real plugins.
"tests/test_http.py" = ["TID251"]

[tool.ruff.lint.isort]
# `tools` is the dev-tooling package (guardrails); `tests` is importable because
# fixture provider packages live under it. Both are ours, so neither should sort
# with third-party imports.
known-first-party = ["keyreach", "tests", "tools"]

[tool.ruff.lint.flake8-bugbear]
# typer declares options as call-expression defaults; that is the framework's
# documented API, not the B008 mutable-default bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.flake8-tidy-imports]
# Provider plugins must not open sockets — they go through ProbeContext, which
# is what makes rate-limiting, redaction, record/replay and the read-only guard
# enforceable in one place (implementation_plan.md §6). The `network_isolation`
# CI check (R0.9) is the real gate; this is the same rule at edit time, so a
# contributor finds out in their editor rather than in review.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Provider plugins must use ProbeContext, not httpx directly (implementation_plan.md §6). Only keyreach/core/http.py may import httpx."
"requests".msg = "Not a dependency. All HTTP goes through ProbeContext (implementation_plan.md §6)."
"socket".msg = "keyreach/core/http.py is the only place sockets are opened (CLAUDE.md, 'Where things live')."

# ==============================================================================
# Types
# ==============================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
pretty = true

[[tool.mypy.overrides]]
# Tests exercise the CLI through typer's runner; strictness there buys little
# and costs readability. They are still fully type-checked, just less pedantic.
module = "tests.*"
disallow_untyped_decorators = false

# ==============================================================================
# Tests
# ==============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
# `auto` so an async test needs no per-test marker. Probes are async from R0.6
# onward, so opting in test by test would be noise.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# `tools` as well as `keyreach`: the guardrails are what enforce the hard rules,
# and an untested branch in a checker is exactly the failure R0.6 found in ruff's
# banned-api rule — configured, believed, and applied to nothing.
source = ["keyreach", "tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
# 100, set in R0.9 because the suite already meets it — a threshold below where
# a project actually sits only ratchets downward. It is not a claim that
# coverage implies correctness; it is a claim that in a tool which decides
# whether someone's key is exposed, an untested line should be a deliberate,
# argued `pragma: no cover` rather than an oversight nobody noticed.
fail_under = 100
